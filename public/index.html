<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>圆桌</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='14' fill='%234f46e5'/%3E%3Ccircle cx='32' cy='8' r='6' fill='%23d97757'/%3E%3Ccircle cx='56' cy='32' r='6' fill='%234285f4'/%3E%3Ccircle cx='32' cy='56' r='6' fill='%2310a37f'/%3E%3Ccircle cx='8' cy='32' r='6' fill='%234d6bfe'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app" id="app">
    <!-- 左：空间列表 -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <span>圆桌</span>
        <span class="mock-tag" id="mockTag" hidden>演示模式</span>
      </div>
      <button class="btn block" id="newSpaceBtn" type="button">＋ 新建空间</button>
      <nav class="space-list" id="spaceList"></nav>
      <button class="engine-bar" id="enginesBtn" type="button" title="查看各个 AI 的登录状态，填写 API key">
        <span class="engine-dots" id="engineDots"></span>
        <span>连接与登录</span>
      </button>
    </aside>
    <div class="scrim" id="scrim"></div>

    <!-- 中：聊天 -->
    <main class="main">
      <div class="mobile-bar">
        <button class="icon-btn" id="menuBtn" aria-label="打开侧栏"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <span class="mobile-title" id="mobileTitle">圆桌</span>
      </div>

      <section class="welcome" id="welcomeView" hidden>
        <div class="welcome-inner">
          <h1>让几个 AI 在同一个空间里一起想、一起写</h1>
          <div class="welcome-actions">
            <button class="btn primary lg" type="button" data-act="new">＋ 新建空间</button>
          </div>
          <div class="engine-summary" id="engineSummary"></div>
        </div>
      </section>

      <section class="space" id="spaceView" hidden>
        <header class="space-head">
          <div class="seg" id="viewSeg">
            <button type="button" data-view="chat" class="active">聊天</button>
            <button type="button" data-view="task">任务协作 <span class="seg-dot" id="taskDot" hidden></span></button>
          </div>
          <div class="space-title">
            <h2 id="spaceTitle"></h2>
            <div class="space-meta queue" id="queueInfo" hidden></div>
          </div>
          <div class="space-actions" id="spaceActions"></div>
        </header>
        <div class="members-bar" id="membersBar"></div>
        <div class="messages" id="messages"></div>
        <div class="task-view" id="taskView" hidden></div>
        <footer class="composer" id="composer">
          <div class="composer-box">
            <textarea id="input" rows="1" placeholder="说点什么，@名字 点名"></textarea>
            <button class="send-btn" id="sendBtn" type="button" title="发送" aria-label="发送"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
          </div>
        </footer>
      </section>
    </main>

    <!-- 右：共享文件夹 -->
    <aside class="files" id="filesPanel" hidden>
      <header class="files-head">
        <b class="files-title" id="filesTitle">共享文件夹</b>
        <div class="files-tools">
          <button class="icon-btn" id="openFolderBtn" type="button" title="在资源管理器中打开"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/></svg></button>
          <button class="icon-btn" id="refreshFilesBtn" type="button" title="刷新"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg></button>
          <button class="icon-btn" id="closeFilesBtn" type="button" title="收起"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
        </div>
      </header>
      <div class="tabs">
        <button class="tab active" type="button" data-tab="files">文件</button>
        <button class="tab" type="button" data-tab="history">改动记录 <span class="count" id="historyCount"></span></button>
      </div>
      <div class="files-body" id="filesBody"></div>
    </aside>
  </div>

  <dialog class="modal" id="modal"></dialog>
  <div class="toasts" id="toasts"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
