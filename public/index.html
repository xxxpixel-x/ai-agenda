<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agenda</title>
  <link rel="icon" href="/brand/agenda.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/css/schedules.css">
  <link rel="stylesheet" href="/css/library.css">
  <link rel="stylesheet" href="/css/usage-meter.css">
  <link rel="stylesheet" href="/css/context-panel.css">
  <link rel="stylesheet" href="/css/memory-view.css">
</head>
<body>
  <div class="app" id="app">
    <!-- 左：空间列表 -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <img class="brand-mark" src="/brand/agenda.svg" alt="">
        <span>Agenda</span>
        <span class="mock-tag" id="mockTag" hidden data-i18n="演示模式">演示模式</span>
        <button class="icon-btn side-toggle" id="sideCollapseBtn" type="button"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="14" rx="2.5"/><path d="M9.5 5v14"/></svg></button>
      </div>
      <button class="nav-row" id="newSpaceBtn" type="button"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span data-i18n="新建空间">新建空间</span></button>
      <nav class="space-list" id="spaceList"></nav>
      <div class="side-foot">
        <a class="nav-row" id="libraryBtn" href="#/library" hidden><span data-icon="library"></span><span data-i18n="资源库">资源库</span></a>
        <a class="nav-row" id="settingsBtn" href="#/settings"><span data-icon="gear"></span><span class="grow" data-i18n="设置">设置</span><span class="engine-dots" id="engineDots"></span></a>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <!-- 中：聊天 -->
    <main class="main">
      <button class="icon-btn side-expand" id="sideExpandBtn" type="button"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="14" rx="2.5"/><path d="M9.5 5v14"/></svg></button>
      <div class="mobile-bar">
        <button class="icon-btn" id="menuBtn" aria-label="打开侧栏" data-i18n-aria-label="打开侧栏"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <span class="mobile-title" id="mobileTitle">Agenda</span>
      </div>

      <section class="welcome" id="welcomeView" hidden>
        <div class="welcome-inner">
          <div class="welcome-art" id="welcomeArt" aria-hidden="true"><img class="welcome-mark" src="/brand/agenda-welcome.svg" alt=""></div>
          <h1 data-i18n="让几个 AI 在同一个空间里一起想、一起写">让几个 AI 在同一个空间里一起想、一起写</h1>
          <div class="welcome-kinds">
            <button class="kind-card" type="button" data-act="new" data-kind="chat">
              <span class="kind-icon" data-icon="chat"></span>
              <b data-i18n="聊天空间">聊天空间</b>
              <span data-i18n="几个 AI 和你自由讨论，可以一起改共享文件">几个 AI 和你自由讨论，可以一起改共享文件</span>
            </button>
            <button class="kind-card" type="button" data-act="new" data-kind="task">
              <span class="kind-icon" data-icon="task"></span>
              <b data-i18n="任务空间">任务空间</b>
              <span data-i18n="写下一个目标，协调者拆成子任务，分给几个 AI 去做">写下一个目标，协调者拆成子任务，分给几个 AI 去做</span>
            </button>
          </div>
          <div class="engine-summary" id="engineSummary"></div>
        </div>
      </section>

      <section class="space" id="spaceView" hidden>
        <header class="space-head">
          <span class="space-kind" id="spaceKind" aria-hidden="true"></span>
          <div class="space-title">
            <h2 id="spaceTitle"></h2>
            <div class="space-meta queue" id="queueInfo" hidden></div>
          </div>
          <div class="members-bar" id="membersBar"></div>
          <div class="space-actions" id="spaceActions"></div>
        </header>
        <div class="messages" id="messages"></div>
        <footer class="composer" id="composer">
          <div class="select-bar" id="selectBar" hidden></div>
          <div class="ended-bar" id="endedBar" hidden></div>
          <div class="composer-box">
            <div class="attachment-cards" id="attachmentCards" hidden></div>
            <textarea id="input" rows="1" placeholder="说点什么，@名字 点名" data-i18n-placeholder="说点什么，@名字 点名"></textarea>
            <button class="send-btn" id="sendBtn" type="button" title="发送" data-i18n-title="发送" aria-label="发送" data-i18n-aria-label="发送"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
          </div>
        </footer>
      </section>

      <section class="page" id="pageView" hidden></section>
    </main>

    <!-- 右：多面板侧栏（文件、改动、计划……由各模块注册） -->
    <aside class="rightbar" id="rightbar" hidden>
      <header class="rb-head">
        <div class="rb-tabs" id="rbTabs" role="tablist"></div>
        <button class="icon-btn" id="rbClose" type="button"></button>
      </header>
      <div class="rb-body" id="filesBody" role="tabpanel"></div>
    </aside>
  </div>

  <dialog id="imagePreview" class="image-preview" aria-label="查看图片" data-i18n-aria-label="查看图片"></dialog>
  <dialog class="modal" id="modal"></dialog>
  <div class="space-menu" id="spaceMenu" role="menu" aria-label="空间操作" data-i18n-aria-label="空间操作" hidden>
    <button type="button" role="menuitem" data-i18n="删除空间">删除空间</button>
  </div>
  <div class="space-menu plain" id="fileMenu" role="menu" aria-label="文件操作" data-i18n-aria-label="文件操作" hidden>
    <button type="button" role="menuitem" data-file-action="reveal"></button>
    <button type="button" role="menuitem" data-file-action="open" data-i18n="用默认程序打开">用默认程序打开</button>
    <button type="button" role="menuitem" data-file-action="copy" data-i18n="复制路径">复制路径</button>
    <button type="button" role="menuitem" data-file-action="relative" data-i18n="复制相对路径">复制相对路径</button>
  </div>
  <div class="member-pop" id="memberPop" role="dialog" hidden></div>
  <div class="toasts" id="toasts"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
